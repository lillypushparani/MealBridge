<div class="overlay">

<div class="modal">

<h2>Request Food</h2>


<label>Meal Type</label>

<div class="meals">

<button
*ngFor="let meal of mealTypes"
[class.active]="mealType === meal"
(click)="mealType = meal"
>
{{meal}}
</button>

</div>


<div *ngIf="mealType === 'others'">
<input
type="text"
placeholder="Enter meal type"
[(ngModel)]="customMealType"
/>
</div>


<label>People Count</label>

<input
type="number"
[(ngModel)]="quantity"
placeholder="30"
/>


<label>Location</label>

<button
class="detect-btn"
(click)="detectLocation()"
>

📍 Detect Location

</button>


<div *ngIf="locationDetected" class="location-success">
Location detected successfully
</div>


<button
class="submit"
(click)="submit()"
>
Request Food
</button>


<button
class="close"
(click)="close.emit()"
>
Close
</button>


</div>

</div>
